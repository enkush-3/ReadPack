name: readpack
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  provider: ^6.1.2
  go_router: ^13.2.0
  cached_network_image: ^3.3.1
  percent_indicator: ^4.2.3
  shared_preferences: ^2.2.3
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  dynamic_color: ^1.7.0
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.3.3
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.3.3
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/public/logos/
    - assets/public/books/
    - assets/locales/
    - assets/data/
